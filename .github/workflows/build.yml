name: Build & Release APK

on:
  push:
    branches: ['**']
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Same signing key every build, so new APKs install over old ones.
      # Uses the SIGNING_KEY_B64 + SIGNING_PASSWORD repo secrets if you add them,
      # otherwise a key generated on the first run and kept in the Actions cache.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.lamp-signing
          key: lamp-signing-v1

      - name: Prepare signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          DIR="$HOME/.lamp-signing"
          mkdir -p "$DIR"
          if [ -n "$SIGNING_KEY_B64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            echo "$SIGNING_KEY_B64" | base64 -d > "$DIR/secret.keystore"
            KS="$DIR/secret.keystore"; PASS="$SIGNING_PASSWORD"
          else
            if [ ! -f "$DIR/lamp.keystore" ]; then
              openssl rand -hex 24 > "$DIR/pass"
              keytool -genkeypair -keystore "$DIR/lamp.keystore" -alias lamp -keyalg RSA -keysize 2048 \
                -validity 10000 -storepass "$(cat "$DIR/pass")" -keypass "$(cat "$DIR/pass")" -dname "CN=Lamp OS"
            fi
            KS="$DIR/lamp.keystore"; PASS="$(cat "$DIR/pass")"
          fi
          echo "::add-mask::$PASS"
          echo "LAMP_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "LAMP_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      # The APK goes to the Releases page, not to workflow artifacts.
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK="LampOS-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "v${VERSION}" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Lamp OS ${VERSION}" \
            --notes "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Download **${APK}** below and open it on the tablet to install or update." \
            --latest

      - name: Delete old releases (keep newest 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
